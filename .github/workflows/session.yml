# GELDDRUCKMASCHINE Trading Session: SIMULATED paper trading only (virtual money, public market data, no keys, no orders).
# Only users with write access (the repo owner) can run workflow_dispatch -> every control action is protected by GitHub login.
# STOP path: the running engine reads this workflow's run list every 5 s (read-only, GITHUB_TOKEN) and reacts to the run-name below,
# so a STOP is seen as soon as GitHub has created the dispatched run (no runner start needed). The control job is audit/fallback.
name: trading-session
run-name: "${{ inputs.action == 'start' && format('start · €{0} · {1} min · {2}', inputs.capital, inputs.minutes, inputs.strategy) || inputs.action == 'close_all' && (inputs.confirm == 'CLOSE ALL' && 'close_all CONFIRMED' || 'close_all REJECTED (confirm fehlt)') || inputs.action }}"
on:
  workflow_dispatch:
    inputs:
      action:   {description: "start | stop | close_all | resume", required: true, default: start, type: choice, options: [start, stop, close_all, resume]}
      capital:  {description: "Virtuelles Kapital EUR (Paper, nur start)", required: false, default: "100"}
      minutes:  {description: "Dauer Minuten 1..180, 0 = unbegrenzt (pausiert am Job-Limit)", required: false, default: "60"}
      strategy: {description: "Strategie (nur start)", required: false, default: funding-fade-4h-x1, type: choice, options: [funding-fade-4h-x1, trend-4h-v1]}
      confirm:  {description: "nur close_all: exakt CLOSE ALL eintippen", required: false, default: ""}
      chain:    {description: "OPT-IN: am Job-Limit automatisch Folge-Job starten (ToS-Risiko, siehe README)", required: false, default: false, type: boolean}
permissions: {contents: write, actions: write}
env: {GDM_HOST: github-actions, GDM_NO_WATCHDOG: "1", GDM_NO_MIRROR: "1", GDM_SYNC: "1", GDM_STORE: /tmp/none}
jobs:
  control:
    if: inputs.action == 'stop' || inputs.action == 'close_all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: confirm check
        if: inputs.action == 'close_all' && inputs.confirm != 'CLOSE ALL'
        run: |
          echo "::error::close_all abgelehnt: confirm muss exakt 'CLOSE ALL' sein"
          exit 1
      - uses: actions/checkout@v4
      - name: commit control file (audit + fallback channel)
        run: |
          mkdir -p store
          printf '{"action":"%s","ts":"%s","by":"%s","run":"%s"}\n' "${{ inputs.action }}" "$(date -u '+%Y-%m-%d %H:%M:%S')" "${{ github.actor }}" "${{ github.run_id }}" > store/control.json
          git config user.name "gelddruckmaschine-bot"; git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add store/control.json && git commit -qm "session control: ${{ inputs.action }} (SIMULATED)"
          for i in 1 2 3 4 5; do git fetch -q origin main && git merge -q --no-edit -X theirs origin/main && git push -q origin HEAD:main && break; sleep 4; done
          cat store/control.json
  session:
    if: inputs.action == 'start' || inputs.action == 'resume'
    runs-on: ubuntu-latest
    timeout-minutes: 185          # job budget 170 min (config.session.job_budget_min) + final sync; hard GitHub limit 6 h
    concurrency: {group: trading-session, cancel-in-progress: false}
    env: {GITHUB_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy requests
      - name: connectivity check (Hyperliquid public info API)
        run: |
          curl -s -m 15 -X POST https://api.hyperliquid.xyz/info -H 'Content-Type: application/json' -d '{"type":"allMids"}' | python -c "import json,sys;d=json.load(sys.stdin);print('Hyperliquid reachable, BTC mid',d['BTC'])"
      - name: run session (tick 60 s, control poll 5 s, state sync 60 s)
        id: run
        run: |
          set -u
          M="${{ inputs.minutes }}"; python -c "import sys;m=float('$M');sys.exit(0 if m==0 or 1<=m<=180 else 1)" || { echo "::error::minutes muss 0 (unbegrenzt) oder 1..180 sein"; exit 1; }
          git config user.name "gelddruckmaschine-bot"; git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          rc=0
          if [ "${{ inputs.action }}" = resume ]; then python session.py resume || rc=$?
          else python session.py start --capital "${{ inputs.capital }}" --minutes "$M" --strategy "${{ inputs.strategy }}" || rc=$?; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; python session.py status | head -c 2500
      - name: final sync (always; a crashed/cancelled job resumes from committed state on next START)
        if: always()
        run: bash sync.sh "session final $(date -u +%T) (SIMULATED)" || true
      - name: chain follow-up job (OPT-IN only, default OFF)
        if: steps.run.outputs.rc == '10' && inputs.chain
        run: |
          N=$(python -c "import json;c=json.load(open('store/sessions/current.json'));s=json.load(open('store/sessions/'+c['id']+'/session.json'));print(len(s.get('jobs',[])))")
          MAX=$(python -c "import json;print(json.load(open('config.json'))['session']['max_chain'])")
          if [ "$N" -lt "$MAX" ]; then gh workflow run session.yml -R "${{ github.repository }}" -f action=resume -f chain=true; echo "chained job $((N+1))/$MAX"; else echo "max_chain $MAX reached -> stays paused"; fi
        env: {GH_TOKEN: "${{ github.token }}"}
